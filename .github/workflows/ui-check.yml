# 批次统一验证：validate/**检查电脑/平板、明暗主题；普通开发推送和合并后不重复跑。
name: article-ui-check
on:
  push:
    branches: ['validate/**']
    paths: ['web/**', 'rpg/**', 'tests/**', '.github/workflows/ui-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  article-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate test HOME
        run: |
          mkdir -p "$RUNNER_TEMP/gongkao-isolated-home"
          echo "HOME=$RUNNER_TEMP/gongkao-isolated-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/gongkao-isolated-home" >> "$GITHUB_ENV"
      - name: Install test tools
        run: |
          pip install pymupdf pillow
          npm install --no-save playwright jsdom
          npx playwright install --with-deps chromium
      - name: Political atlas and contextual word annotations (fake AI)
        run: |
          node tests/ui_politics.cjs
          node tests/ui_updates362.cjs
          node tests/ui_updates363.cjs
      - name: Sect and mentor quick regressions
        run: |
          node tests/test_guide.cjs
          node tests/test_scene_portal.cjs
      - name: Character encounters and independent dialogue (fake AI)
        run: |
          node tests/ui_characters.cjs
          node tests/ui_characters_assets.cjs
      - name: Scene panels, trial hall, contest and map/shelf regressions
        run: |
          node tests/ui_scene_panels.cjs --subject=行测
          node tests/ui_scene_panels.cjs --subject=申论
          node tests/ui_trial_hall.cjs --shots
          node tests/ui_contest_scene.cjs --subject=行测 --shots
          node tests/ui_layout335.cjs --subject=行测 --shots
          node tests/ui_layout335.cjs --subject=申论
      - name: Task board, reading viewport and built-in art
        run: |
          node tests/ui_task_board.cjs --subject=行测
          node tests/ui_layout337.cjs --subject=行测
          node tests/ui_art338.cjs --subject=行测
          node tests/ui_task_board.cjs --subject=申论
          node tests/ui_layout337.cjs --subject=申论
          node tests/ui_art338.cjs --subject=申论
      - name: Training workspace, scene clock and folded entry
        run: |
          node tests/ui_training339.cjs --subject=行测
          node tests/ui_daylight339.cjs --subject=行测
          node tests/ui_training339.cjs --subject=申论
          node tests/ui_daylight339.cjs --subject=申论
          node tests/ui_mock_html.cjs
          node tests/ui_mock_details.cjs
          node tests/ui_mock_imports.cjs
          node tests/ui_fixes359.cjs
          node tests/ui_zoom359.cjs
          node tests/ui_fixes359.cjs --subject=申论
          node tests/ui_zoom359.cjs --subject=申论
          node tests/ui_tablet_shell.cjs --subject=行测
          node tests/ui_tablet_shell.cjs --subject=申论
          node tests/ui_skillbook.cjs --subject=行测
          node tests/ui_skillbook.cjs --subject=申论
          node tests/ui_tutor_format.cjs --subject=行测
          node tests/ui_tutor_format.cjs --subject=申论
      - name: Narrative and learning contracts
        run: |
          node tests/test_narrative_ink.cjs
          node tests/test_journey_dom.cjs --subject=申论
          node tests/test_journey_dom.cjs --subject=行测
          node tests/ui_map_navigation.cjs --subject=申论
          node tests/ui_map_navigation.cjs --subject=行测
          node tests/ui_back_button.cjs --subject=申论
          node tests/ui_back_button.cjs --subject=行测
          node tests/test_pen_guard.cjs
          node tests/ui_pen_draw.cjs --subject=申论
          node tests/ui_pen_draw.cjs --subject=行测
          node tests/ui_status_navigation.cjs --subject=申论
          node tests/ui_study_regions.cjs --subject=申论
          node tests/ui_status_navigation.cjs --subject=行测
          node tests/ui_study_regions.cjs --subject=行测
          node tests/ui_fixed_layout.cjs --subject=申论
          node tests/ui_fixed_layout.cjs --subject=行测
          node tests/ui_grouped_rewards.cjs --subject=申论
          node tests/ui_grouped_rewards.cjs --subject=行测
          node tests/ui_compact_review.cjs --subject=申论
          node tests/ui_compact_review.cjs --subject=行测
          node tests/ui_mac_update.cjs --subject=申论
          node tests/ui_mac_update.cjs --subject=行测
          node tests/ui_workspace_309.cjs --subject=行测
          node tests/ui_workspace_309.cjs --subject=申论
          node tests/ui_reader_310.cjs --subject=行测
          node tests/ui_reader_310.cjs --subject=申论
          node tests/ui_images_311.cjs
          node tests/ui_narrative.cjs --subject=申论
          node tests/ui_narrative.cjs --subject=行测
          node tests/ui_world.cjs --subject=申论
          node tests/ui_world.cjs --subject=行测
      - name: Real article interactions and screenshots
        run: node tests/ui_articles.cjs
      - name: Real shenlun exam interactions and screenshots
        run: node tests/ui_shenlun.cjs
      - name: Shared brand and two subject screenshots
        run: node tests/ui_brand.cjs
      - name: Layout check (both subjects, desktop/tablet × light/dark; screenshots only on problems)
        run: |
          node tests/ui_layout_check.cjs --subject=申论
          node tests/ui_layout_check.cjs --subject=行测
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: article-ui-screenshots
          path: ui-artifacts/
          retention-days: 7
