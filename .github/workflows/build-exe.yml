# 改 rpg/version.py 的版本号推到 main → 在 Windows 上打包 公考模拟器.exe、在 Linux 上打包平板 App gongkao-simulator.apk、
# 在 Mac 上打包 公考模拟器.app（Apple 芯片，gongkao-simulator-mac.zip），
# 一起发到 Releases（tag v<版本>）。一个程序里有两个科目（申论官途 / 行测修仙传）。
# 推开发分支时也会跑一遍测试和打包来验证，但只有 main 才发 Release。
# 平板 App 沿用行测时的包名 com.xingce.xiuxian 和签名钥匙（android/xiuxian.keystore），已装的平板才能直接覆盖升级。
# 程序里「设置 → 🆕 版本与更新 → 检查更新」读的就是这里发的 Release
name: build-exe

on:
  push:
    branches: [main, claude/dazzling-fermat-0n9kbc]
    paths: [rpg/version.py, .github/workflows/build-exe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller pywebview segno pymupdf certifi

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name 公考模拟器
          --icon web/icons/app.ico
          --add-data "web;web" --add-data "defaults;defaults" --add-data "rpg/data;rpg/data"
          --hidden-import server --collect-submodules rpg
          --hidden-import segno --collect-all pymupdf --collect-all webview
          app.py

      - name: Smoke test
        shell: pwsh
        run: |
          $out = & dist/公考模拟器.exe --run-script tests/smoke_frozen.py | Out-String
          Write-Output $out
          if ($out -notmatch "SMOKE-OK") { throw "frozen smoke test failed" }

      - name: Relaunch test (一键更新换文件后能重新打开)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "relaunch"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist/公考模拟器.exe "$d/app.exe"
          Copy-Item dist/公考模拟器.exe "$d/app.new.exe"
          $log = Join-Path $HOME ".shenlun-rpg/启动日志.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          & "$d/app.exe" --run-script tests/smoke_relaunch.py "$d/app.new.exe" "$d/app.exe" | Out-String | Write-Output
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and ((Get-Content $log -Raw -Encoding utf8) -match "已启动")) { $ok = $true; break }
          }
          if (Test-Path $log) { Get-Content $log -Encoding utf8 | Write-Output }
          Get-Process app -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "$d/app.new.exe") { throw "新 exe 没换上去" }
          if (-not $ok) { throw "换文件后重开的程序没起来" }

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import re;print(re.search(r'VERSION = \"(.+?)\"', open('rpg/version.py', encoding='utf-8').read()).group(1))")
          # GitHub 会清理纯中文资源名；下载文件用 ASCII，应用和资源标签保留中文。
          cp dist/公考模拟器.exe dist/gongkao-simulator.exe
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "dist/gongkao-simulator.exe#公考模拟器.exe" --clobber
          else
            # 更新说明：取 rpg/data/changelog.md 里这一版的那一节（没有就用提交说明，去掉署名行）
            NOTES=$(PYTHONIOENCODING=utf-8 python -c "import sys; sys.path.insert(0, '.'); from rpg import changelog; e = changelog.entries(); print('\n'.join('- ' + x for x in e[0]['items']) if e and e[0]['version'] == '$V' else '')")
            [ -n "$NOTES" ] || NOTES=$(git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):')
            gh release create "v$V" "dist/gongkao-simulator.exe#公考模拟器.exe" --title "公考模拟器 v$V" --notes "$NOTES"
          fi
          # 清理本次中文资源名被 GitHub 自动生成的占位文件，避免重复下载入口。
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" --jq ' .assets[] | select(.name == "default.exe") | .id')
          if [ -n "$OLD" ]; then gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD"; fi

  apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build apk
        run: bash android/build.sh

      - name: Upload to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' rpg/version.py)
          gh release upload "v$V" android/build/gongkao-simulator.apk --clobber

  mac:
    needs: build
    runs-on: macos-latest          # Apple 芯片（M / A 系列）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller pywebview segno pymupdf pillow pyobjc-framework-Vision certifi

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name GongkaoSimulator
          --osx-bundle-identifier com.shenlun.guantu
          --icon web/icons/icon-512.png
          --add-data "web:web" --add-data "defaults:defaults" --add-data "rpg/data:rpg/data"
          --hidden-import server --collect-submodules rpg
          --hidden-import segno --collect-all pymupdf
          --hidden-import Vision --hidden-import Foundation
          app.py

      - name: Name, version, sign, zip
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' rpg/version.py)
          APP="dist/公考模拟器.app"
          mv dist/GongkaoSimulator.app "$APP"
          P="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 公考模拟器" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 公考模拟器" "$P" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 公考模拟器" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$P" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent "公考模拟器.app" ../gongkao-simulator-mac.zip)
          ls -l gongkao-simulator-mac.zip

      - name: Smoke test
        run: |
          out=$("dist/公考模拟器.app/Contents/MacOS/GongkaoSimulator" --run-script tests/smoke_frozen.py)
          echo "$out"
          echo "$out" | grep -q SMOKE-OK

      - name: Upload to release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' rpg/version.py)
          gh release upload "v$V" gongkao-simulator-mac.zip --clobber
