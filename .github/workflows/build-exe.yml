# 三端validate并行构建一次；main只发布同提交已验证资源，不重建。
name: build-exe

on:
  push:
    branches: [main, 'validate/**']
    paths: [.github/release-request.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/validate/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Isolate test HOME
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          home = Path(os.environ['RUNNER_TEMP']) / 'gongkao-isolated-home'
          home.mkdir(parents=True, exist_ok=True)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              for key in ('HOME', 'USERPROFILE'):
                  f.write(key + '=' + str(home) + '\n')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller pywebview segno pymupdf pillow certifi

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name 公考模拟器
          --icon web/icons/app.ico
          --add-data "web;web" --add-data "defaults;defaults" --add-data "rpg/data;rpg/data"
          --hidden-import server --collect-submodules rpg
          --hidden-import segno --collect-all pymupdf --collect-all webview
          app.py

      - name: Smoke test
        shell: pwsh
        run: |
          $out = & dist/公考模拟器.exe --run-script tests/smoke_frozen.py | Out-String
          Write-Output $out
          if ($out -notmatch "SMOKE-OK") { throw "frozen smoke test failed" }

      - name: Relaunch test (一键更新换文件后能重新打开)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "relaunch"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist/公考模拟器.exe "$d/app.exe"
          Copy-Item dist/公考模拟器.exe "$d/app.new.exe"
          $log = Join-Path $HOME ".shenlun-rpg/启动日志.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          & "$d/app.exe" --run-script tests/smoke_relaunch.py "$d/app.new.exe" "$d/app.exe" | Out-String | Write-Output
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            if ((Test-Path $log) -and ((Get-Content $log -Raw -Encoding utf8) -match "已启动")) { $ok = $true; break }
          }
          if (Test-Path $log) { Get-Content $log -Encoding utf8 | Write-Output }
          Get-Process app -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "$d/app.new.exe") { throw "新 exe 没换上去" }
          if (-not $ok) { throw "换文件后重开的程序没起来" }

      - name: ASCII package name
        shell: bash
        run: cp dist/公考模拟器.exe dist/gongkao-simulator.exe

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: dist/gongkao-simulator.exe
          if-no-files-found: error
          retention-days: 7

  apk:
    if: startsWith(github.ref, 'refs/heads/validate/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build apk
        run: bash android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: android/build/gongkao-simulator.apk
          if-no-files-found: error
          retention-days: 7

  mac:
    if: startsWith(github.ref, 'refs/heads/validate/')
    runs-on: macos-latest          # Apple 芯片（M / A 系列）
    steps:
      - uses: actions/checkout@v4

      - name: Isolate test HOME
        run: |
          mkdir -p "$RUNNER_TEMP/gongkao-isolated-home"
          echo "HOME=$RUNNER_TEMP/gongkao-isolated-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/gongkao-isolated-home" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller pywebview segno pymupdf pillow pyobjc-framework-Vision certifi

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name GongkaoSimulator
          --osx-bundle-identifier com.shenlun.guantu
          --icon web/icons/icon-512.png
          --add-data "web:web" --add-data "defaults:defaults" --add-data "rpg/data:rpg/data"
          --hidden-import server --collect-submodules rpg
          --hidden-import segno --collect-all pymupdf
          --hidden-import Vision --hidden-import Foundation
          app.py

      - name: Name, version, sign, zip
        run: |
          V=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' rpg/version.py)
          APP="dist/公考模拟器.app"
          mv dist/GongkaoSimulator.app "$APP"
          P="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 公考模拟器" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 公考模拟器" "$P" || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 公考模拟器" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$P" || true
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          (cd dist && ditto -c -k --sequesterRsrc --keepParent "公考模拟器.app" ../gongkao-simulator-mac.zip)
          ls -l gongkao-simulator-mac.zip

      - name: Smoke test
        run: |
          out=$("dist/公考模拟器.app/Contents/MacOS/GongkaoSimulator" --run-script tests/smoke_frozen.py)
          echo "$out"
          echo "$out" | grep -q SMOKE-OK

      - name: Mac update restart smoke
        run: |
          out=$("dist/公考模拟器.app/Contents/MacOS/GongkaoSimulator" --run-script tests/smoke_mac_update.py gongkao-simulator-mac.zip)
          echo "$out"
          echo "$out" | grep -q MAC-UPDATE-FROZEN-OK

      - uses: actions/upload-artifact@v4
        with:
          name: package-mac
          path: gongkao-simulator-mac.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish verified packages without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_validated.py
